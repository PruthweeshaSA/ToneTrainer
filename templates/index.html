<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tone Trainer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="notation-selector-container">
        <select id="notation-select" class="styled-select">
            <option value="cdef">C D E F G A B C</option>
            <option value="doremi">Do Re Mi Fa So La Ti Do</option>
            <option value="sarega" selected>Sa Re Ga Ma Pa Dha Ni Sa</option>
        </select>
    </div>

    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark/Light Mode">☀️</button>

    <div class="main-wrapper">
        <div class="container">
        <h1>Tone Trainer</h1>
        
        <div class="controls">
            <button id="start-btn">Start Training</button>
            <div class="score-display">Score: <span id="score">0</span></div>
            <div id="message" class="message">Press 'Start Training' to begin</div>
        </div>

        <div class="keyboard-container">
            <div class="keyboard-row top-row">
                <div class="key-group">
                    <div class="key" data-key="q">Q<br><span></span></div>
                    <div class="key" data-key="w">W<br><span></span></div>
                    <div class="key" data-key="e">E<br><span></span></div>
                    <div class="key" data-key="r">R<br><span></span></div>
                </div>
                <div class="key-group">
                    <div class="key" data-key="u">U<br><span></span></div>
                    <div class="key" data-key="i">I<br><span></span></div>
                    <div class="key" data-key="o">O<br><span></span></div>
                    <div class="key" data-key="p">P<br><span></span></div>
                </div>
            </div>

            <div class="keyboard-row middle-row">
                <div class="key-group">
                    <div class="key" data-key="a">A<br><span></span></div>
                    <div class="key" data-key="s">S<br><span></span></div>
                    <div class="key" data-key="d">D<br><span></span></div>
                    <div class="key" data-key="f">F<br><span></span></div>
                </div>
                <div class="key-group">
                    <div class="key" data-key="j">J<br><span></span></div>
                    <div class="key" data-key="k">K<br><span></span></div>
                    <div class="key" data-key="l">L<br><span></span></div>
                    <div class="key" data-key=";">;<br><span></span></div>
                </div>
            </div>

            <div class="keyboard-row bottom-row">
                <div class="key-group">
                    <div class="key" data-key="z">Z<br><span></span></div>
                    <div class="key" data-key="x">X<br><span></span></div>
                    <div class="key" data-key="c">C<br><span></span></div>
                    <div class="key" data-key="v">V<br><span></span></div>
                </div>
                <div class="key-group">
                    <div class="key" data-key="n">N<br><span></span></div>
                    <div class="key" data-key="m">M<br><span></span></div>
                    <div class="key" data-key=",">,<br><span></span></div>
                    <div class="key" data-key=".">.<br><span></span></div>
                </div>
            </div>
        </div>
    </div>
    </div>
    
    <script src="/static/script.js"></script>
</body>
</html>
